<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300">
<defs>
 <filter id="g"><feGaussianBlur stdDeviation="4"/></filter>
 <radialGradient id="r"><stop stop-color="#E8FFE8"/><stop offset=".25" stop-color="#39FF14" stop-opacity=".8"/><stop offset="1" stop-color="#39FF14" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1000" height="300" rx="24" fill="#020603"/>

<g transform="translate(500 155)" fill="none">
 <circle r="95" stroke="#39FF14" opacity=".2" stroke-dasharray="3 9"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="9s" repeatCount="indefinite"/></circle>
 <circle r="70" stroke="#7CFF68" stroke-width="3" stroke-dasharray="20 8"><animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="4s" repeatCount="indefinite"/></circle>
 <circle r="42" stroke="#39FF14" stroke-width="4" stroke-dasharray="65 20"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2.8s" repeatCount="indefinite"/></circle>
 <circle r="22" fill="url(#r)" stroke="#E8FFE8"><animate attributeName="r" values="15;30;15" dur="1.6s" repeatCount="indefinite"/></circle>
</g>
<text x="500" y="35" fill="#39FF14" font-family="monospace" font-size="14" text-anchor="middle" letter-spacing="5">ARSAM // ENERGY REACTOR</text>
<text x="500" y="278" fill="#7ACF7A" font-family="monospace" font-size="11" text-anchor="middle" letter-spacing="2">POWER • MOTION • BUILD</text>
<rect x="1" y="1" width="998" height="298" rx="24" fill="none" stroke="#39FF14" stroke-opacity=".22"/>
</svg>