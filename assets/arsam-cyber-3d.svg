<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="420" viewBox="0 0 1200 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#010301"/>
      <stop offset="48%" stop-color="#06160B"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#39FF14" stop-opacity=".35"/>
      <stop offset="55%" stop-color="#39FF14" stop-opacity=".08"/>
      <stop offset="100%" stop-color="#39FF14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#39FF14" stop-opacity=".15"/>
      <stop offset="50%" stop-color="#B6FF9F" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#39FF14" stop-opacity=".15"/>
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="soft">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#39FF14" flood-opacity=".75"/>
    </filter>
    <clipPath id="clip">
      <rect x="0" y="0" width="1200" height="420" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="420" fill="url(#bg)"/>
    <ellipse cx="600" cy="210" rx="420" ry="220" fill="url(#glow)"/>

    <!-- ambient scanlines -->
    <g opacity=".09">
      <path d="M0 40H1200M0 80H1200M0 120H1200M0 160H1200M0 200H1200M0 240H1200M0 280H1200M0 320H1200M0 360H1200" stroke="#39FF14"/>
    </g>

    <!-- perspective floor -->
    <g opacity=".55" fill="none" stroke="#39FF14">
      <path d="M0 335 Q600 260 1200 335"/>
      <path d="M0 365 Q600 285 1200 365"/>
      <path d="M0 395 Q600 310 1200 395"/>
      <path d="M0 420 Q600 330 1200 420"/>
      <path d="M150 420 L500 285"/>
      <path d="M320 420 L540 278"/>
      <path d="M480 420 L570 272"/>
      <path d="M720 420 L630 272"/>
      <path d="M880 420 L660 278"/>
      <path d="M1050 420 L700 285"/>
      <path d="M1200 420 L750 300"/>
    </g>

    <!-- moving scan beam -->
    <rect x="-200" y="0" width="180" height="420" fill="#39FF14" opacity=".035" transform="skewX(-18)">
      <animate attributeName="x" from="-250" to="1250" dur="5.5s" repeatCount="indefinite"/>
    </rect>

    <!-- stars / particles -->
    <g fill="#C6FFBA">
      <circle cx="120" cy="90" r="1.5"><animate attributeName="opacity" values=".15;1;.15" dur="2.3s" repeatCount="indefinite"/></circle>
      <circle cx="230" cy="150" r="1"><animate attributeName="opacity" values="1;.1;1" dur="1.8s" repeatCount="indefinite"/></circle>
      <circle cx="340" cy="70" r="1.4"><animate attributeName="opacity" values=".2;1;.2" dur="2.8s" repeatCount="indefinite"/></circle>
      <circle cx="940" cy="95" r="1"><animate attributeName="opacity" values="1;.15;1" dur="1.7s" repeatCount="indefinite"/></circle>
      <circle cx="1030" cy="180" r="1.6"><animate attributeName="opacity" values=".1;1;.1" dur="2.1s" repeatCount="indefinite"/></circle>
      <circle cx="1080" cy="110" r="1"><animate attributeName="opacity" values=".2;1;.2" dur="2.5s" repeatCount="indefinite"/></circle>
      <circle cx="860" cy="55" r="1.2"><animate attributeName="opacity" values="1;.15;1" dur="2s" repeatCount="indefinite"/></circle>
      <circle cx="185" cy="250" r="1.2"><animate attributeName="opacity" values=".2;1;.2" dur="2.6s" repeatCount="indefinite"/></circle>
    </g>

    <!-- title -->
    <g text-anchor="middle">
      <text x="600" y="72" fill="#39FF14" font-family="monospace" font-size="18" letter-spacing="7" opacity=".8">
        ARSAM // CYBER SYSTEM
      </text>
      <text x="600" y="120" fill="#E8FFE8" font-family="monospace" font-size="44" font-weight="900" letter-spacing="9">
        BUILD YOUR OWN WORLD
      </text>
      <text x="600" y="150" fill="#7ACF7A" font-family="monospace" font-size="14" letter-spacing="4">
        GAMES • 3D • AI • WEB • ARLUN
      </text>
    </g>

    <!-- central 3D energy core -->
    <g transform="translate(600 252)" filter="url(#shadow)">
      <circle r="105" fill="none" stroke="#39FF14" stroke-width="1" opacity=".12">
        <animate attributeName="r" values="90;115;90" dur="3.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".2;0;.2" dur="3.2s" repeatCount="indefinite"/>
      </circle>
      <circle r="82" fill="none" stroke="#39FF14" stroke-width="1.5" stroke-dasharray="7 10">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="9s" repeatCount="indefinite"/>
      </circle>
      <ellipse rx="98" ry="35" fill="none" stroke="#9CFF88" stroke-width="1.5" opacity=".8">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse rx="98" ry="35" fill="none" stroke="#39FF14" stroke-width="1" opacity=".45"
               transform="rotate(60)">
        <animateTransform attributeName="transform" type="rotate" from="60" to="420" dur="8s" repeatCount="indefinite"/>
      </ellipse>

      <!-- wireframe cube -->
      <g fill="none" stroke="url(#line)" stroke-width="2.2">
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="7s" repeatCount="indefinite"/>
        <path d="M-58-58 L58-58 L58 58 L-58 58 Z"/>
        <path d="M-34-34 L82-34 L82 82 L-34 82 Z" opacity=".55"/>
        <path d="M-58-58 L-34-34 M58-58 L82-34 M58 58 L82 82 M-58 58 L-34 82"/>
        <path d="M-20-58 L-20 58 M20-58 L20 58 M-58-20 L58-20 M-58 20 L58 20" opacity=".45"/>
      </g>

      <circle r="8" fill="#E8FFE8">
        <animate attributeName="r" values="5;10;5" dur="1.3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".6;1;.6" dur="1.3s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- orbiting node -->
    <g>
      <circle cx="600" cy="252" r="130" fill="none" stroke="#39FF14" stroke-opacity=".08"/>
      <g>
        <circle cx="730" cy="252" r="4" fill="#39FF14" filter="url(#soft)"/>
        <circle cx="730" cy="252" r="1.8" fill="#E8FFE8"/>
        <animateTransform attributeName="transform" type="rotate" from="0 600 252" to="360 600 252" dur="4.6s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- footer HUD -->
    <g font-family="monospace" font-size="11" fill="#7ACF7A">
      <text x="42" y="388">SYSTEM: ONLINE</text>
      <text x="1040" y="388" text-anchor="end">ARLUN: INITIALIZING</text>
    </g>
  </g>

  <rect x="1" y="1" width="1198" height="418" rx="28" fill="none" stroke="#39FF14" stroke-opacity=".28"/>
</svg>